name: Update badges

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/plugin.yml'
      - 'pom.xml'
      - '.github/workflows/update-badges.yml'

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create SVG badges from project versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from html import escape
          import re

          plugin = Path('src/main/resources/plugin.yml').read_text(encoding='utf-8')
          def yaml_scalar(key):
              match = re.search(r'^' + re.escape(key) + r'\s*:\s*[\'\"]?([^\'\"#\r\n]+)', plugin, re.M)
              if not match:
                  raise ValueError(f'Missing {key} in plugin.yml')
              return match.group(1).strip()

          version = yaml_scalar('version')
          paper = yaml_scalar('api-version')
          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          java = root.findtext('m:properties/m:java.version', namespaces=ns)
          if not java:
              raise ValueError('Missing properties/java.version in pom.xml')

          output = Path('images/badges')
          output.mkdir(parents=True, exist_ok=True)
          def badge(filename, label, value):
              # Approximate width for predictable badge sizing without external packages
              left = max(56, round(len(label) * 7.2 + 20))
              right = max(38, round(len(value) * 7.2 + 20))
              width = left + right
              l = escape(label)
              v = escape(value)
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="22" role="img" aria-label="{l}: {v}">
          <title>{l}: {v}</title>
          <defs><linearGradient id="shine" x2="0" y2="100%"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient></defs>
          <clipPath id="rounded"><rect width="{width}" height="22" rx="4"/></clipPath>
          <g clip-path="url(#rounded)"><rect width="{left}" height="22" fill="#30363D"/><rect x="{left}" width="{right}" height="22" fill="#C45BEB"/><rect width="{width}" height="22" fill="url(#shine)"/></g>
          <g font-family="Verdana,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle"><text x="{left/2}" y="15" fill="#fff">{l}</text><text x="{left+right/2}" y="15" fill="#180E20">{v}</text></g>
          </svg>'''
              (output / filename).write_text(svg + '\n', encoding='utf-8')

          badge('version.svg', 'Version', version)
          badge('paper.svg', 'Paper', paper)
          badge('java.svg', 'Java', java)
          print(f'Generated SVGs: Version={version}, Paper={paper}, Java={java}')
          PY

      - name: Create compact combined PNG for Discord
        shell: bash
        run: |
          python3 -m pip install --user cairosvg pillow
          python3 - <<'PYCODE'
          from pathlib import Path
          from io import BytesIO
          import cairosvg
          from PIL import Image

          folder = Path('images/badges')
          badges = []
          for name in ('version', 'paper', 'java'):
              png_bytes = cairosvg.svg2png(url=str(folder / f'{name}.svg'), scale=2)
              badges.append(Image.open(BytesIO(png_bytes)).convert('RGBA'))

          # Wide opaque Discord-colored background prevents transparent margins being cropped.
          canvas = Image.new('RGBA', (1800, 240), (43, 45, 49, 255))
          gap = 28
          strip_width = sum(b.width for b in badges) + gap * (len(badges) - 1)
          x = (canvas.width - strip_width) // 2
          for badge in badges:
              y = (canvas.height - badge.height) // 2
              canvas.alpha_composite(badge, (x, y))
              x += badge.width + gap
          canvas.save(folder / 'badges-combined.png')

          # The old separate PNGs are no longer needed.
          for name in ('version.png', 'paper.png', 'java.png'):
              (folder / name).unlink(missing_ok=True)
          print('Generated images/badges/badges-combined.png')
          PYCODE

      - name: Commit updated badge images
        shell: bash
        run: |
          git add -A images/badges
          if git diff --cached --quiet; then
            echo "No badge changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update SVG badges and compact Discord PNG'
          git push
