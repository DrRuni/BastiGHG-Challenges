name: Update badges

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/plugin.yml'
      - 'pom.xml'
      - '.github/workflows/update-badges.yml'

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install YAML parser
        run: python3 -m pip install pyyaml

      - name: Generate SVG version badges and remove generated PNGs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from html import escape
          import yaml

          data = yaml.safe_load(Path('src/main/resources/plugin.yml').read_text(encoding='utf-8'))
          version = str(data['version'])
          paper = str(data['api-version'])

          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          java = root.findtext('m:properties/m:java.version', namespaces=ns)
          if not java:
              raise ValueError('Missing properties/java.version in pom.xml')

          badges_dir = Path('docs/images/badges')
          badges_dir.mkdir(parents=True, exist_ok=True)

          def badge_svg(label, value):
              left = max(56, round(len(label) * 7.2 + 20))
              right = max(38, round(len(value) * 7.2 + 20))
              width = left + right
              l, v = escape(label), escape(value)
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="22" role="img" aria-label="{l}: {v}">
          <title>{l}: {v}</title>
          <defs><linearGradient id="shine" x2="0" y2="100%"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient></defs>
          <clipPath id="rounded"><rect width="{width}" height="22" rx="4"/></clipPath>
          <g clip-path="url(#rounded)"><rect width="{left}" height="22" fill="#30363D"/><rect x="{left}" width="{right}" height="22" fill="#C45BEB"/><rect width="{width}" height="22" fill="url(#shine)"/></g>
          <g font-family="Verdana,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle"><text x="{left/2}" y="15" fill="#fff">{l}</text><text x="{left+right/2}" y="15" fill="#180E20">{v}</text></g>
          </svg>'''
              return svg + '\n'

          def write_badge(name, label, value):
              path = badges_dir / f'{name}.svg'
              path.write_text(badge_svg(label, str(value)), encoding='utf-8')
              print(f'Generated {path}')

          for name, label, value in (
              ('version', 'Version', version),
              ('paper', 'Paper', paper),
              ('java', 'Java', java),
          ):
              write_badge(name, label, value)

          games = {
              'mobarmybattle': 'MobArmyBattle',
              'levelborder': 'LevelBorder',
              'levelblock': 'LevelBlock',
              'chunkrandomizer': 'ChunkRandomizer',
          }
          game_versions = data.get('game-versions') or {}
          for key, label in games.items():
              path = badges_dir / f'{key}-version.svg'
              if key in game_versions:
                  write_badge(f'{key}-version', label, game_versions[key])
              else:
                  path.unlink(missing_ok=True)
                  print(f'Skipped {key}: missing in plugin.yml')

          # Test: generate a compact game button using the same SVG method as the badges.
          # No viewBox, fixed pixel dimensions, and no changes to existing buttons.
          test_button = badges_dir / 'chunkrandomizer-button-test.svg'
          test_button.write_text('''<svg xmlns="http://www.w3.org/2000/svg" width="190" height="36" role="img" aria-label="ChunkRandomizer game documentation">
          <title>ChunkRandomizer</title>
          <defs>
            <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#FFD700"/><stop offset="1" stop-color="#FF2400"/></linearGradient>
            <linearGradient id="shine" x2="0" y2="100%"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset=".55" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient>
          </defs>
          <rect x="1" y="1" width="188" height="34" rx="6" fill="#101322"/>
          <rect x="2" y="2" width="186" height="32" rx="5" fill="url(#bg)"/>
          <rect x="2" y="2" width="186" height="32" rx="5" fill="url(#shine)"/>
          <rect x="3" y="3" width="184" height="30" rx="4" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width=".6"/>
          <text x="95" y="17" fill="#fff" font-family="Arial,DejaVu Sans,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">ChunkRandomizer</text>
          <text x="95" y="27" fill="#fff" font-family="Arial,DejaVu Sans,sans-serif" font-size="6" letter-spacing="1" text-anchor="middle">VIEW DOCUMENTATION</text>
          </svg>''' + '\n', encoding='utf-8')
          print(f'Generated test button: {test_button}')

          # Only the former generated PNG directories are cleaned.
          # The manually added docs/images/spigot/banner.png and lobby.png remain untouched.
          for directory in (
              badges_dir,
              Path('docs/images/spigot/badges'),
              Path('docs/images/spigot/buttons'),
          ):
              if directory.exists():
                  for png_path in directory.rglob('*.png'):
                      png_path.unlink()
                      print(f'Removed obsolete generated PNG: {png_path}')

          print(f'Updated SVG badges: Version {version}, Paper {paper}, Java {java}')
          PY

      - name: Commit updated SVG badges and PNG cleanup
        shell: bash
        run: |
          git add -A docs/images/badges docs/images/spigot
          if git diff --cached --quiet; then
            echo "No badge changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Generate SVG badges only and remove generated PNGs'
          git push
