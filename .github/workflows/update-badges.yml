name: Update badges

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/plugin.yml'
      - 'pom.xml'
      - 'docs/images/buttons/**'
      - '.github/workflows/update-badges.yml'

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install image tools
        run: python3 -m pip install cairosvg pillow pyyaml

      - name: Generate SVG badges and Spigot PNG assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from html import escape
          from io import BytesIO
          import cairosvg
          import yaml
          from PIL import Image

          data = yaml.safe_load(Path('src/main/resources/plugin.yml').read_text(encoding='utf-8'))
          version = str(data['version'])
          paper = str(data['api-version'])

          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          java = root.findtext('m:properties/m:java.version', namespaces=ns)
          if not java:
              raise ValueError('Missing properties/java.version in pom.xml')

          badges_dir = Path('docs/images/badges')
          spigot_dir = Path('docs/images/spigot')
          spigot_badges = spigot_dir / 'badges'
          spigot_buttons = spigot_dir / 'buttons'
          buttons_dir = Path('docs/images/buttons')
          for directory in (badges_dir, spigot_badges, spigot_buttons):
              directory.mkdir(parents=True, exist_ok=True)

          def badge_svg(label, value):
              left = max(56, round(len(label) * 7.2 + 20))
              right = max(38, round(len(value) * 7.2 + 20))
              width = left + right
              l, v = escape(label), escape(value)
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="22" role="img" aria-label="{l}: {v}">
          <title>{l}: {v}</title>
          <defs><linearGradient id="shine" x2="0" y2="100%"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient></defs>
          <clipPath id="rounded"><rect width="{width}" height="22" rx="4"/></clipPath>
          <g clip-path="url(#rounded)"><rect width="{left}" height="22" fill="#30363D"/><rect x="{left}" width="{right}" height="22" fill="#C45BEB"/><rect width="{width}" height="22" fill="url(#shine)"/></g>
          <g font-family="Verdana,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle"><text x="{left/2}" y="15" fill="#fff">{l}</text><text x="{left+right/2}" y="15" fill="#180E20">{v}</text></g>
          </svg>'''
              return svg + '\n'

          def write_badge(name, label, value):
              svg_path = badges_dir / f'{name}.svg'
              svg_path.write_text(badge_svg(label, value), encoding='utf-8')
              # Render at 3x for sharp display on Spigot; transparency retained.
              cairosvg.svg2png(url=str(svg_path), write_to=str(spigot_badges / f'{name}.png'), scale=3)
              print(f'Generated {svg_path} and Spigot PNG')

          # README versions stay as scalable SVGs.
          for name, label, value in (
              ('version', 'Version', version),
              ('paper', 'Paper', paper),
              ('java', 'Java', java),
          ):
              write_badge(name, label, value)

          # Game versions use the same pink badge style, also as SVGs.
          games = {
              'mobarmybattle': 'MobArmyBattle',
              'levelborder': 'LevelBorder',
              'levelblock': 'LevelBlock',
              'chunkrandomizer': 'ChunkRandomizer',
          }
          game_versions = data.get('game-versions') or {}
          for key, label in games.items():
              if key in game_versions:
                  write_badge(f'{key}-version', label, str(game_versions[key]))
              else:
                  (badges_dir / f'{key}-version.svg').unlink(missing_ok=True)
                  (spigot_badges / f'{key}-version.png').unlink(missing_ok=True)
                  print(f'Skipping {key}: not present in plugin.yml')

          # Combined core PNG for Spigot/Discord, with 30% larger badges
          # than the original 45px strip and a transparent background.
          core_pngs = [Image.open(spigot_badges / f'{name}.png').convert('RGBA')
                       for name in ('version', 'paper', 'java')]
          target_height = round(45 * 1.30)
          core_pngs = [img.resize((round(img.width * target_height / img.height), target_height),
                                  Image.Resampling.LANCZOS) for img in core_pngs]
          gap = 28
          strip_width = sum(img.width for img in core_pngs) + gap * (len(core_pngs) - 1)
          canvas = Image.new('RGBA', (max(1500, strip_width + 40), 140), (0, 0, 0, 0))
          x = (canvas.width - strip_width) // 2
          for img in core_pngs:
              canvas.alpha_composite(img, (x, (canvas.height - img.height) // 2))
              x += img.width + gap
          canvas.save(spigot_badges / 'badges-combined.png')

          # Spigot also needs PNG copies of the existing SVG game buttons.
          # Convert all SVG buttons, including headings/language buttons,
          # keeping their relative subfolder structure.
          if buttons_dir.exists():
              for svg_path in buttons_dir.rglob('*.svg'):
                  relative_png = svg_path.relative_to(buttons_dir).with_suffix('.png')
                  target = spigot_buttons / relative_png
                  target.parent.mkdir(parents=True, exist_ok=True)
                  cairosvg.svg2png(url=str(svg_path), write_to=str(target), scale=2)
                  print(f'Converted {svg_path} -> {target}')

          # Remove previously generated PNGs from the SVG-only badge folder.
          for old_png in badges_dir.glob('*.png'):
              old_png.unlink()
              print(f'Removed obsolete {old_png}')

          print(f'Updated badges: Version {version}, Paper {paper}, Java {java}')
          PY

      - name: Commit updated badge and Spigot images
        shell: bash
        run: |
          git add -A docs/images/badges docs/images/spigot
          if git diff --cached --quiet; then
            echo "No badge changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update SVG badges and Spigot PNG assets'
          git push
