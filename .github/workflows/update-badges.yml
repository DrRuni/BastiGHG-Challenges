
name: Update badges

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/plugin.yml'
      - 'pom.xml'
      - '.github/workflows/update-badges.yml'

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install image tools
        run: python3 -m pip install pyyaml cairosvg pillow

      - name: Generate SVG badges and selected PNG version images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from html import escape
          from io import BytesIO
          import cairosvg
          from PIL import Image
          import yaml

          data = yaml.safe_load(Path('src/main/resources/plugin.yml').read_text(encoding='utf-8'))
          version = str(data['version'])
          paper = str(data['api-version'])

          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          java = root.findtext('m:properties/m:java.version', namespaces=ns)
          if not java:
              raise ValueError('Missing properties/java.version in pom.xml')

          badges_dir = Path('docs/images/badges')
          badges_dir.mkdir(parents=True, exist_ok=True)

          def badge_svg(label, value):
              left = max(56, round(len(label) * 7.2 + 20))
              right = max(38, round(len(value) * 7.2 + 20))
              width = left + right
              l, v = escape(label), escape(value)
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="22" role="img" aria-label="{l}: {v}">
          <title>{l}: {v}</title>
          <defs><linearGradient id="shine" x2="0" y2="100%"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient></defs>
          <clipPath id="rounded"><rect width="{width}" height="22" rx="4"/></clipPath>
          <g clip-path="url(#rounded)"><rect width="{left}" height="22" fill="#30363D"/><rect x="{left}" width="{right}" height="22" fill="#C45BEB"/><rect width="{width}" height="22" fill="url(#shine)"/></g>
          <g font-family="Verdana,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle"><text x="{left/2}" y="15" fill="#fff">{l}</text><text x="{left+right/2}" y="15" fill="#180E20">{v}</text></g>
          </svg>'''
              return svg + '\n'

          def badge_png(label, value, scale=3):
              png = cairosvg.svg2png(
                  bytestring=badge_svg(label, str(value)).encode('utf-8'),
                  scale=scale,
              )
              return Image.open(BytesIO(png)).convert('RGBA')

          def write_badge(name, label, value):
              path = badges_dir / f'{name}.svg'
              path.write_text(badge_svg(label, str(value)), encoding='utf-8')
              print(f'Generated {path}')

          for name, label, value in (
              ('version', 'Version', version),
              ('paper', 'Paper', paper),
              ('java', 'Java', java),
          ):
              write_badge(name, label, value)

          games = {
              'mobarmybattle': 'MobArmyBattle',
              'levelborder': 'LevelBorder',
              'levelblock': 'LevelBlock',
              'chunkrandomizer': 'ChunkRandomizer',
          }

          game_versions = data.get('game-versions') or {}

          for key, label in games.items():
              path = badges_dir / f'{key}-version.svg'
              png_path = badges_dir / f'{key}-version.png'

              if key in game_versions:
                  write_badge(f'{key}-version', label, game_versions[key])

                  image = badge_png(label, game_versions[key])

                  # Same badge height as the combined Core image
                  target_height = 58
                  image = image.resize(
                      (
                          round(image.width * target_height / image.height),
                          target_height
                      ),
                      Image.Resampling.LANCZOS
                  )

                  # Transparent canvas, same size as the combined Core image
                  canvas = Image.new(
                      'RGBA', (1500, 140), (0, 0, 0, 0)
                  )

                  # Center horizontally and vertically
                  x = (canvas.width - image.width) // 2
                  y = (canvas.height - image.height) // 2

                  canvas.alpha_composite(image, (x, y))
                  canvas.save(png_path)

                  print(f'Generated {png_path}')

              else:
                  path.unlink(missing_ok=True)
                  png_path.unlink(missing_ok=True)
                  print(f'Skipped {key}: missing in plugin.yml')

          # Combined Core PNG
          core_badges = [badge_png(label, value) for label, value in (
              ('Version', version), ('Paper', paper), ('Java', java),
          )]

          target_height = round(45 * 1.30)
          core_badges = [
              img.resize(
                  (round(img.width * target_height / img.height), target_height),
                  Image.Resampling.LANCZOS
              )
              for img in core_badges
          ]

          gap = 28
          strip_width = sum(img.width for img in core_badges) + gap * (len(core_badges) - 1)
          canvas = Image.new(
              'RGBA', (max(1500, strip_width + 40), 140), (0, 0, 0, 0)
          )

          x = (canvas.width - strip_width) // 2

          for img in core_badges:
              canvas.alpha_composite(
                  img, (x, (canvas.height - img.height) // 2)
              )
              x += img.width + gap

          combined_path = badges_dir / 'badges-combined.png'
          canvas.save(combined_path)
          print(f'Generated {combined_path}')

          # Remove obsolete individual Core PNGs
          for name in ('version.png', 'paper.png', 'java.png'):
              (badges_dir / name).unlink(missing_ok=True)

          # Remove obsolete generated Spigot PNGs
          for directory in (
              Path('docs/images/spigot/badges'),
              Path('docs/images/spigot/buttons'),
          ):
              if directory.exists():
                  for png_path in directory.rglob('*.png'):
                      png_path.unlink()
                      print(f'Removed old Spigot PNG: {png_path}')

          print(f'Updated SVG badges: Version {version}, Paper {paper}, Java {java}')
          PY

      - name: Commit updated SVG badges and selected PNG images
        shell: bash
        run: |
          git add -A docs/images/badges docs/images/spigot
          if git diff --cached --quiet; then
            echo "No badge changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Center game version badges on consistent canvas'
          git push
