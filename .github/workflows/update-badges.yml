name: Update badges

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/plugin.yml'
      - 'pom.xml'
      - '.github/workflows/update-badges.yml'

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install image tools
        run: python3 -m pip install cairosvg pillow pyyaml

      - name: Generate project and game badges
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from html import escape
          from io import BytesIO
          import cairosvg
          import yaml
          from PIL import Image

          data = yaml.safe_load(Path('src/main/resources/plugin.yml').read_text(encoding='utf-8'))
          version = str(data['version'])
          paper = str(data['api-version'])
          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          java = root.findtext('m:properties/m:java.version', namespaces=ns)
          if not java:
              raise ValueError('Missing properties/java.version in pom.xml')

          output = Path('images/badges')
          output.mkdir(parents=True, exist_ok=True)

          def badge_svg(label, value):
              left = max(56, round(len(label) * 7.2 + 20))
              right = max(38, round(len(value) * 7.2 + 20))
              width = left + right
              l, v = escape(label), escape(value)
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="22" role="img" aria-label="{l}: {v}">
          <title>{l}: {v}</title>
          <defs><linearGradient id="shine" x2="0" y2="100%"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient></defs>
          <clipPath id="rounded"><rect width="{width}" height="22" rx="4"/></clipPath>
          <g clip-path="url(#rounded)"><rect width="{left}" height="22" fill="#30363D"/><rect x="{left}" width="{right}" height="22" fill="#C45BEB"/><rect width="{width}" height="22" fill="url(#shine)"/></g>
          <g font-family="Verdana,Arial,sans-serif" font-size="11" font-weight="bold" text-anchor="middle"><text x="{left/2}" y="15" fill="#fff">{l}</text><text x="{left+right/2}" y="15" fill="#180E20">{v}</text></g>
          </svg>'''
              return svg + '\n'

          def as_image(label, value):
              png = cairosvg.svg2png(bytestring=badge_svg(label, value).encode('utf-8'))
              return Image.open(BytesIO(png)).convert('RGBA')

          for name, label, value in (
              ('version', 'Version', version),
              ('paper', 'Paper', paper),
              ('java', 'Java', java),
          ):
              (output / f'{name}.svg').write_text(badge_svg(label, value), encoding='utf-8')

          # Discord Core badge strip (keep these values for consistent layout).
          badges = [as_image('Version', version), as_image('Paper', paper), as_image('Java', java)]
          canvas = Image.new('RGBA', (1500, 140), (43, 45, 49, 255))
          gap = 28
          target_height = 45
          badges = [b.resize((round(b.width * target_height / b.height), target_height), Image.Resampling.LANCZOS) for b in badges]
          strip_width = sum(b.width for b in badges) + gap * (len(badges) - 1)
          x = (canvas.width - strip_width) // 2
          for b in badges:
              canvas.alpha_composite(b, (x, (canvas.height - b.height) // 2))
              x += b.width + gap
          canvas.save(output / 'badges-combined.png')
          for name in ('version.png', 'paper.png', 'java.png'):
              (output / name).unlink(missing_ok=True)

          # Individual game version badges, centrally stored.
          names = {
              'mobarmybattle': 'MobArmyBattle',
              'levelborder': 'LevelBorder',
              'levelblock': 'LevelBlock',
              'chunkroulette': 'ChunkRoulette',
          }
          game_versions = data.get('game-versions') or {}
          for key, label in names.items():
              target = output / f'{key}-version.png'
              if key not in game_versions:
                  print(f'Skipping {key}: not present in plugin.yml')
                  target.unlink(missing_ok=True)
                  continue
              image = as_image(label, str(game_versions[key]))
              image.resize((image.width * 3, image.height * 3), Image.Resampling.LANCZOS).save(target)
              print(f'Generated {target}')
          print(f'Updated Core badges: {version}, Paper {paper}, Java {java}')
          PY

      - name: Commit updated badge images
        shell: bash
        run: |
          git add -A images/badges
          if git diff --cached --quiet; then
            echo "No badge changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update core and game version badges'
          git push
