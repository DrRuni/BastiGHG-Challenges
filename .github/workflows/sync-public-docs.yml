
name: Sync Public Documentation

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - CHANGELOG.md
      - .github/workflows/sync-public-docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development repository
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Checkout public releases repository
        uses: actions/checkout@v4
        with:
          repository: DrRuni/BastiGHG-Challenges-Releases
          token: ${{ secrets.RELEASES_SYNC_TOKEN }}
          path: public
          ref: main

      - name: Copy documentation
        run: |
          cp source/README.md public/README.md
          cp source/CHANGELOG.md public/CHANGELOG.md

      - name: Commit and push
        working-directory: public
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "docs: sync public documentation"
          git push origin HEAD:main
