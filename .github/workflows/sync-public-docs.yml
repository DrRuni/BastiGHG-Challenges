
name: Sync Public Documentation

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - CHANGELOG.md
      - game-changelogs/**
      - .github/workflows/sync-public-docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development repository
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Checkout public releases repository
        uses: actions/checkout@v4
        with:
          repository: DrRuni/BastiGHG-Challenges-Releases
          token: ${{ secrets.RELEASES_SYNC_TOKEN }}
          path: public
          ref: main

      - name: Copy public documentation
        run: |
          cp source/README.md public/README.md
          cp source/CHANGELOG.md public/CHANGELOG.md

          mkdir -p public/game-changelogs

          cp source/game-changelogs/CHANGELOG-MobArmyBattle.md public/game-changelogs/
          cp source/game-changelogs/CHANGELOG-LevelBorder.md public/game-changelogs/
          cp source/game-changelogs/CHANGELOG-LevelBlock.md public/game-changelogs/

      - name: Commit and push changes
        working-directory: public
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md CHANGELOG.md game-changelogs/

          if git diff --cached --quiet; then
            echo "No documentation changes."
            exit 0
          fi

          git commit -m "docs: sync public documentation"
          git push origin HEAD:main
