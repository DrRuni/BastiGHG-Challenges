  <rect x="1.5" y="1.5" width="277" height="50" rx="9" fill="#101322"/>
  <rect x="3" y="3" width="274" height="47" rx="7" fill="url(#bg)"/>
  <rect x="3" y="3" width="274" height="47" rx="7" fill="url(#shine)"/>
