  <text x="140" y="25" fill="#fff" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="bold" text-anchor="middle">ChunkRandomizer</text>
  <text x="140" y="40" fill="#fff" font-family="Arial,DejaVu Sans,sans-serif" font-size="9" letter-spacing="1.5" text-anchor="middle">VIEW DOCUMENTATION</text>
