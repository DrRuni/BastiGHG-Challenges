  help:
    title: "<gold>========== LevelBorder Scoreboard =========="
    hide: "<gray>/lbscore hide <dark_gray>→ Hide scoreboard"
    reload: "<gray>/lbscore reload <dark_gray>→ Show scoreboard again"
    reset: "<gray>/lbscore reset <dark_gray>→ Admin"
    footer: "<gold>==========================================="

