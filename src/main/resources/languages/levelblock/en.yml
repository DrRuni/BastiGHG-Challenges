# LevelBlock EN Language

file-version: 3

loading:
  starting: "LevelBlock is loading..."
  worlds: "Loading worlds..."
  world-settings: "Loading world settings..."
  data: "Loading LevelBlock data..."
  overworld: "Preparing overworld..."
  nether: "Preparing Nether..."
  end: "Preparing End..."
  listeners: "Registering listeners..."
  commands: "Registering commands..."
  border: "Preparing border..."
  error: "ERROR: %status%"

commands:
  levelblock:
    load-first-settings: "<gold>Please load LevelBlock first."
    load-first: "<red>LevelBlock must be loaded first."
    admin-start-only: "<red>❌ Only an admin may start LevelBlock."
    already-started: "<red>LevelBlock has already been started."
    start-game-world-only: "<red>The event can only be started in a LevelBlock game world."
    started: "<green>LevelBlock has been started."
    admin-reset-only: "<red>❌ Only an admin may reset LevelBlock."
    unknown: "<red>Unknown subcommand."
    reset-complete: "<green>✔ LevelBlock has been reset."
    player:
      name: "Reset Player Data"
      line-1: "Clears inventories, XP and game progress."
      line-2: "Worlds and buildings are preserved."
    world:
      name: "Reset Everything"
      line-1: "Deletes all player and world data."
      line-2: "Recreates all challenge worlds."

    vote:
      reset-worlds: "Reset worlds and all data"
      reset-progress: "Reset player data and progress"

    help:
      title: "<gold>══════ LevelBlock Commands ══════"
      info: "<yellow>/levelblock info <gray>- Show game information"
      start: "<yellow>/levelblock start <gray>- Start the challenge"
      settings: "<yellow>/levelblock gamesettings <gray>- Open game settings"
      reset: "<yellow>/levelblock reset <gray>- Reset player data and progress"
      reset-world: "<yellow>/levelblock reset world <gray>- Completely reset everything"

    info:
      title: "<gold>══════ LevelBlock ══════"
      goal: "<gray>Goal: Expand your world block by block."
      start-area: "<gray>At the beginning, only a small area is available."
      progress-1: "<gray>As your level progresses, more blocks are unlocked"
      progress-2: "<gray>and the playable world continues to grow."
      commands-title: "<gold>Important commands:"
      start-command: "<yellow>/levelblock start <gray>- Start the challenge"
      settings-command: "<yellow>/levelblock gamesettings <gray>- Open settings"
      help-command: "<yellow>/levelblock <gray>- Show all commands"

reset-messages:
  player:
    title: "<green>↻ LevelBlock <gray>• <yellow>Player Data Reset"
    starting: "<gray>Resetting player data and game progress..."
    finished: "<green>✔ LevelBlock has been reset."
    details: "<gray>Worlds and buildings are preserved."

  world:
    title: "<green>↻ LevelBlock <gray>• <gold>Full Reset"
    starting: "<gray>Resetting all player and world data..."
    players: "<yellow>⌛ Preparing players..."
    unloading: "<yellow>⌛ Unloading game worlds..."
    generating: "<yellow>⌛ Recreating game worlds..."
    loading: "<yellow>⌛ Loading game worlds..."
    finished: "<green>✔ LevelBlock has been fully reset."
    details: "<gray>All challenge worlds have been recreated."
    failed: "<red>✘ LevelBlock reset failed. Check the console."

move-listener:
  need-level: "<red>You need 1 level!"
  block-unlocked: "<green>New block unlocked! <gray>-1 Level"

player-listener:
  welcome:
    name: "Run´s LevelBlock"
    settings: "<gray>Settings: <aqua>/gamesettings"
    info: "<gray>Game info: <aqua>/levelblock info"