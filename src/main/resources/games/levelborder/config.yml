# LevelBorder Config

file-version: 1

mob-spawning:
  enabled: true
  # Enables or disables additional monster spawning by the plugin.

  debug:
    vanilla-spawns: false
    # Shows natural vanilla spawns in dark red in the console.

    plugin-spawns: false
    # Shows plugin spawns in the console.
    # Green = inside the border
    # Pink = outside the border

    failed-attempts: false
    # Shows failed spawn attempts.
    # Enable only for debugging, otherwise the console will be spammed.

  assist-inside-until-border-size: 31.0
  # The plugin may assist with spawning inside the border up to this border size.

  interval-ticks: 40
  # How often the plugin attempts to spawn monsters.

  distance:
    min-to-player: 28
    # Minimum distance from the player.

    max-to-player: 96
    # Maximum distance from the player.

  vertical-search:
    surface-chance: 0.70
    # Chance of surface spawns inside the border.
    # 0.70 = 70% surface, 30% underground.

    underground-search-down: 12
    # How many blocks downward are searched.

    pack-search-down: 4
    # How far downward the plugin searches for suitable ground for group spawns.

  small-border:
    inside-candidate-chance: 0.70
    # For small borders: how strongly the plugin searches inside the border.
    # 0.70 = 70% of candidate positions are searched inside the border.

  amount:
    global-multiplier: 1.0
    # General spawn amount multiplier.
    # 1.0 = normal, 0.5 = fewer, 2.0 = more.

    inside-border-multiplier: 1.0
    # Spawn amount multiplier inside the border.

    outside-border-multiplier: 1.0
    # Spawn amount multiplier outside the border.

  caps:
    per-player: 24
    # Maximum number of plugin-spawned monsters near a player.

    per-world: 80
    # Maximum number of plugin-spawned monsters in the entire world.

    per-chunk: 6
    # Maximum number of plugin-spawned monsters per chunk.

  attempts:
    rounds-per-check: 1
    # Number of spawn rounds per interval.

    candidate-positions: 8
    # Number of possible positions checked per round.

  mobs:
    zombie:
      enabled: true
      weight: 100
      max-pack-size: 3
      # Regular zombies. Common and may spawn in small groups.

    zombie-villager:
      enabled: true
      weight: 4
      max-pack-size: 1
      # Zombie villagers. Rare and always spawn individually.

    skeleton:
      enabled: true
      weight: 100
      max-pack-size: 2
      # Skeletons. Common, but limited to groups of two.

    spider:
      enabled: true
      weight: 100
      max-pack-size: 2
      # Spiders. Common, but require enough space.

    creeper:
      enabled: true
      weight: 75
      max-pack-size: 1
      # Creepers. Slightly less common and spawn individually.

    enderman:
      enabled: true
      weight: 10
      max-pack-size: 1
      # Endermen. Very rare and spawn individually.

    witch:
      enabled: true
      weight: 4
      max-pack-size: 1
      # Witches. Very rare and spawn individually.
